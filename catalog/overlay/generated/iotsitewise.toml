defer_reason = "Pinned complete summary shapes are metadata, including nested status/error/enrichment metadata and policy identity references, not definitions, samples or credentials. Monitor projects/dashboards retain their bound parent in identity; workspace pipeline/task definitions use their own ARN, never execution identity. Dataset branches cover both KENDRA and SITEWISE without optional narrowing filters. Access-policy PORTAL and PROJECT branches bind only their corresponding producer, retaining resource type and bound resource identity; native resource IDs must equal the bound request parent and the opposite resource variant must be absent. Remaining detail/content families remain unapproved."

