defer_reason = "Paged safe configuration summaries use NextToken and MaxResults<=100; TableName is optional. Each summary has TableName and optional IndexName (absent for the table). Needs optional-safe composite identity to distinguish table from same-table indexes without missing-identity failure or collisions. TableName-only identity loses index records."

