[operation.DescribeActivity]
class = "expand"
scope = "region"
items = "$"
[operation.DescribeActivity.identity]
arn = "activityArn"
[operation.DescribeActivity.paginator]
kind = "none"
[operation.DescribeActivity.bind]
"activityArn" = { from = "ListActivities", path = "activityArn" }

[operation.DescribeMapRun]
class = "defer"
defer_reason = "Output is payload-free execution progress/configuration, item/execution counts and redrive metadata. Requires the same V06 runtime-scope decision and an enabled ListMapRuns.mapRunArn source; ListMapRuns is deferred, so no complete safe parent plan exists."

[operation.DescribeStateMachine]
class = "defer"
defer_reason = "Definition is content by default. includedData=METADATA_ONLY documents definition={}, but does not establish suppression of definition-derived variableReferences (state names and variable references). Requires documented server-side suppression or explicit V06 basis before enabling; hash exclusions are not redaction."

[operation.DescribeStateMachineAlias]
class = "defer"
defer_reason = "output: secret-bearing member shape"

[operation.ListActivities]
class = "defer"
defer_reason = "identity: no ARN member and no modeled identifiers"

[operation.ListExecutions]
class = "defer"
defer_reason = "ExecutionListItem is payload-free runtime metadata, not state-machine configuration. V06 architectural-runtime scope needs a reviewed execution-selection policy; unrestricted listing includes completed execution history contrary to V22. STANDARD-only state-machine listing also needs a type predicate; EXPRESS children require mapRunArn instead."

[operation.ListMapRuns]
class = "defer"
defer_reason = "MapRunListItem contains payload-free execution/map/state-machine ARNs and dates. Requires a V06 architectural-runtime selection policy and an enabled execution parent: executionArn must come from ListExecutions.executionArn, currently deferred; it cannot bind to a state-machine ARN."

[operation.ListStateMachineAliases]
class = "defer"
defer_reason = "identity: no ARN member and no modeled identifiers"

[operation.ListStateMachineVersions]
class = "expand"
scope = "region"
items = "stateMachineVersions"
[operation.ListStateMachineVersions.identity]
arn = "stateMachineVersionArn"
[operation.ListStateMachineVersions.paginator]
kind = "token"
input = "nextToken"
output = "nextToken"
[operation.ListStateMachineVersions.bind]
"stateMachineArn" = { from = "ListStateMachines", path = "stateMachineArn" }

[operation.ListStateMachines]
class = "enumerate"
scope = "region"
[operation.ListStateMachines.identity]
arn = "stateMachineArn"

[operation.ListTagsForResource]
class = "defer"
defer_reason = "V31 requires bulk tagging first. Output contains only tags, with no resourceArn for stable parent identity. Requires request-derived identity, union binding from ListStateMachines.stateMachineArn and ListActivities.activityArn, and bulk-coverage fallback gating; tag keys alone are not resource identities."
