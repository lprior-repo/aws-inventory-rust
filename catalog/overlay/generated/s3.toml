[operation.GetBucketAbac]
class = "defer"
defer_reason = "AbacStatus is bucket configuration, not object data. Bind Bucket from ListBuckets.Name and ExpectedBucketOwner from account; output has no bucket identity. Requires parent-identity inheritance and bucket-region/addressing dispatch before expanding this singleton."

[operation.GetBucketAccelerateConfiguration]
class = "defer"
defer_reason = "Status is transfer-acceleration configuration; RequestCharged is request telemetry, not configuration. No RequestPayer opt-in is authorized. Requires ListBuckets.Name bucket binding, account owner guard, inherited bucket identity and regional addressing; exclude RequestCharged only after the singleton merge is supported."

[operation.GetBucketAcl]
class = "defer"
defer_reason = "Owner and Grants describe bucket access controls. Requires ListBuckets.Name plus ExpectedBucketOwner=account, inherited bucket identity and bucket regional addressing. Do not substitute GetObjectAcl or treat each grantee as a bucket."

[operation.GetBucketAnalyticsConfiguration]
class = "defer"
defer_reason = "AnalyticsConfiguration.Id binds from ListBucketAnalyticsConfigurations.AnalyticsConfigurationList.Id within the same parent bucket. Requires correlated Bucket+Id bindings, bucket-region dispatch and parent-aware configuration identity; the complete list already returns the configuration, so later skip this redundant get only after list parity is proven."

[operation.GetBucketCors]
class = "defer"
defer_reason = "CORSRules is a configuration list without stable rule IDs; it must enrich the parent bucket, not create anonymous resources. Requires Bucket=ListBuckets.Name, ExpectedBucketOwner=account, inherited bucket identity and regional addressing."

[operation.GetBucketEncryption]
class = "defer"
defer_reason = "ServerSideEncryptionConfiguration.Rules describes default encryption, not key material. Requires inherited bucket identity, owner guard, correct bucket endpoint and modeled absent-configuration handling. KMS relationship path is ServerSideEncryptionConfiguration.Rules.ApplyServerSideEncryptionByDefault.KMSMasterKeyID; aliases and key IDs require resolution before claiming an ARN edge."

[operation.GetBucketIntelligentTieringConfiguration]
class = "defer"
defer_reason = "IntelligentTieringConfiguration.Id binds from ListBucketIntelligentTieringConfigurations.IntelligentTieringConfigurationList.Id for the same bucket. Requires correlated Bucket+Id identity and bindings plus regional dispatch; this duplicates the full list item and must not be skipped without proven list parity."

[operation.GetBucketInventoryConfiguration]
class = "defer"
defer_reason = "InventoryConfiguration.Id binds from ListBucketInventoryConfigurations.InventoryConfigurationList.Id for the same bucket. Requires correlated Bucket+Id identity, owner guard, region and general-purpose versus directory control endpoints. Reads export configuration only, never the inventory report objects."

[operation.GetBucketLifecycleConfiguration]
class = "defer"
defer_reason = "Rules and TransitionDefaultMinimumObjectSize are bucket lifecycle configuration; Rules.ID is optional, so rules cannot independently identify resources. Requires parent bucket enrichment/identity, owner guard and regional/control endpoint dispatch. No lifecycle action is executed."

[operation.GetBucketLocation]
class = "defer"
defer_reason = "LocationConstraint is a region hint, not a resource identity. Requires Bucket=ListBuckets.Name and ExpectedBucketOwner=account plus output-to-endpoint binding; empty constraint means us-east-1 and legacy EU means eu-west-1. HeadBucket is preferred by the model but remains denied by the shared Head prefix classifier."

[operation.GetBucketLogging]
class = "defer"
defer_reason = "LoggingEnabled.TargetBucket is a destination bucket name; TargetPrefix and TargetObjectKeyFormat are configuration, never object listings. Requires inherited source-bucket identity, regional addressing, owner guard and name-to-bucket-ARN relationship resolution. Empty LoggingEnabled must remain disabled configuration rather than failed inventory."

[operation.GetBucketMetadataConfiguration]
class = "defer"
defer_reason = "GetBucketMetadataConfigurationResult.MetadataConfigurationResult is V2 metadata-table configuration, not table records. Requires inherited Bucket identity, owner guard and regional addressing. Preserve structured configuration and table/IAM references without reading journal, inventory or annotation table contents."

[operation.GetBucketMetadataTableConfiguration]
class = "defer"
defer_reason = "GetBucketMetadataTableConfigurationResult.MetadataTableConfigurationResult.S3TablesDestinationResult.TableBucketArn and TableArn describe V1 metadata destinations, not table records. Requires inherited bucket identity, owner guard, regional addressing and V1/V2 outcome handling; model documents HTTP 405 for a V2 configuration read through this V1 API."

[operation.GetBucketMetricsConfiguration]
class = "defer"
defer_reason = "MetricsConfiguration.Id binds from ListBucketMetricsConfigurations.MetricsConfigurationList.Id within the same bucket. This is request-metrics configuration, not CloudWatch metric values. Requires correlated Bucket+Id identity, owner guard and regional/control endpoint dispatch; do not add a paid metric-data call."

[operation.GetBucketNotificationConfiguration]
class = "defer"
defer_reason = "TopicConfigurations.TopicArn, QueueConfigurations.QueueArn and LambdaFunctionConfigurations.LambdaFunctionArn are relationship targets; EventBridgeConfiguration can be empty but enabled. Requires inherited bucket identity, regional addressing, owner guard and typed relation support; never invoke a destination or read its contents."

[operation.GetBucketOwnershipControls]
class = "defer"
defer_reason = "OwnershipControls.Rules describes bucket object-ownership policy, not object instances. Requires Bucket=ListBuckets.Name, ExpectedBucketOwner=account, inherited identity, regional addressing and explicit missing-configuration handling."

[operation.GetBucketPolicy]
class = "defer"
defer_reason = "Policy is a bucket-policy document string, not object content. Requires Bucket=ListBuckets.Name, owner guard, inherited bucket identity, regional/control endpoint dispatch and missing-policy handling. Preserve the opaque modeled string; no runtime JSON parsing or policy-derived resource edges are introduced."

[operation.GetBucketPolicyStatus]
class = "defer"
defer_reason = "PolicyStatus.IsPublic is bucket metadata, not an identity. Requires parent bucket enrichment with inherited identity, Bucket=ListBuckets.Name, ExpectedBucketOwner=account, regional addressing and explicit absent-policy handling."

[operation.GetBucketReplication]
class = "defer"
defer_reason = "ReplicationConfiguration.Role and Rules.Destination.Bucket are IAM-role and bucket-ARN references; Rules.Destination.EncryptionConfiguration.ReplicaKmsKeyID may be an ID or ARN. Requires inherited source bucket identity, regional dispatch, owner guard, absent-configuration handling and reference resolution; never perform replication or read object contents."

[operation.GetBucketRequestPayment]
class = "defer"
defer_reason = "Payer reports requester-pays configuration without consenting to charges. Requires Bucket=ListBuckets.Name, ExpectedBucketOwner=account, inherited bucket identity and regional addressing. Do not set RequestPayer=requester on any collector call."

[operation.GetBucketTagging]
class = "defer"
defer_reason = "TagSet.Key and TagSet.Value enrich the same bucket, not independent tag resources. Requires parent-identity inheritance, Bucket=ListBuckets.Name, ExpectedBucketOwner=account, regional addressing and NoSuchTagSet-to-empty-tag semantics. No tag payload is fabricated from ListBuckets."

[operation.GetBucketVersioning]
class = "defer"
defer_reason = "Status and MFADelete describe bucket versioning; neither identifies the bucket. Requires inherited parent identity, Bucket=ListBuckets.Name, ExpectedBucketOwner=account and regional addressing. An empty output denotes unversioned configuration, not a missing resource."

[operation.GetBucketWebsite]
class = "defer"
defer_reason = "RedirectAllRequestsTo, IndexDocument, ErrorDocument and RoutingRules are website configuration, never fetched objects or URLs. Requires inherited bucket identity, owner guard, regional addressing and missing-website handling. Do not follow redirect hosts or expand index/error document keys."

[operation.GetObjectLockConfiguration]
class = "defer"
defer_reason = "ObjectLockConfiguration is bucket-level retention-default configuration despite the operation name; it is not GetObjectRetention. Requires Bucket=ListBuckets.Name, ExpectedBucketOwner=account, inherited bucket identity, regional addressing and missing-configuration handling."

[operation.GetPublicAccessBlock]
class = "defer"
defer_reason = "PublicAccessBlockConfiguration contains bucket-level booleans, not effective account-wide public-access policy. Requires inherited bucket identity, owner guard, regional addressing and missing-configuration handling; account-level settings belong to a separately reviewed s3-control operation."

[operation.ListBucketAnalyticsConfigurations]
class = "defer"
defer_reason = "AnalyticsConfigurationList.Id is unique only within a bucket. Requires parent Bucket+Id identity and Bucket=ListBuckets.Name, ExpectedBucketOwner=account plus per-bucket regional dispatch. Pagination is ContinuationToken -> NextContinuationToken with IsTruncated; items already contain the full configuration including StorageClassAnalysis.DataExport.Destination.S3BucketDestination.Bucket."

[operation.ListBucketIntelligentTieringConfigurations]
class = "defer"
defer_reason = "IntelligentTieringConfigurationList.Id is bucket-scoped configuration identity, not a global ID. Requires parent Bucket+Id identity, Bucket=ListBuckets.Name, ExpectedBucketOwner=account and regional dispatch. Pagination is ContinuationToken -> NextContinuationToken with IsTruncated; no object contents or tiering action is requested."

[operation.ListBucketInventoryConfigurations]
class = "defer"
defer_reason = "InventoryConfigurationList.Id requires parent Bucket+Id identity, owner guard and bucket-region/control endpoint dispatch. Pagination is ContinuationToken -> NextContinuationToken with IsTruncated. InventoryConfigurationList.Destination.S3BucketDestination.Bucket is a destination ARN; read only its configuration, never the exported inventory files."

[operation.ListBucketMetricsConfigurations]
class = "defer"
