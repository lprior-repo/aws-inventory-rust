[package]
name = "record-bench"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
inventory-core = { git = "https://github.com/lprior-repo/aws-inventory-rust.git", rev = "4a54ec49edc36a772126b93f151db9ad4409c992" }
minicbor = { version = "2.3", features = ["std"] }
rkyv = "0.8"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
