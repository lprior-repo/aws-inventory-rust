  InventoryReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only role assumed by aws-inventory from TrustedPrincipalArn.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Ref InventoryReadOnlyPolicy1
        - !Ref InventoryReadOnlyPolicy2
        - !Ref InventoryReadOnlyPolicy3
        - !Ref InventoryReadOnlyPolicy4
        - !Ref InventoryReadOnlyPolicy5
        - !Ref InventoryReadOnlyPolicy6
        - !Ref InventoryReadOnlyPolicy7
        - !Ref InventoryReadOnlyPolicy8
        - !Ref InventoryReadOnlyPolicy9
        - !Ref InventoryReadOnlyPolicy10
        - !Ref InventoryReadOnlyPolicy11
        - !Ref InventoryReadOnlyPolicy12

Outputs:
  RoleArn:
    Description: Pass to aws-inventory scan --role-arn for a single account.
    Value: !GetAtt InventoryReadOnlyRole.Arn
