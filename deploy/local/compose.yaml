services:
  postgres:
    image: docker.io/library/postgres:18-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:-inventory-local-only}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - inventory-pgdata-18:/var/lib/postgresql
    shm_size: 2gb
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_connections=200
      - -c
      - max_locks_per_transaction=256
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
volumes:
  inventory-pgdata-18:
