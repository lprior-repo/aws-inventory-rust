[workspace]
members = ["crates/core", "crates/engine", "crates/aws", "crates/sdk-catalog", "crates/harness", "crates/sdk-operations", "crates/catalog-tool", "crates/cmdb-bench", "crates/cmdb-ui", "crates/cmdb-view"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
rust-version = "1.101"

[workspace.dependencies]
inventory-core = { path = "crates/core" }
inventory-engine = { path = "crates/engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util", "fs", "test-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = "0.3.34"
tracing = "0.1.44"
sha2 = "0.11.1"
base16ct = "1.0.0"
# Upstream's merged SQLite 0.39 support; retain bundled SQLite and allocation limits.
# https://github.com/transact-rs/sqlx/pull/4502
# Published 0.9.0 requires libsqlite3-sys <0.38; this pin supports SQLite 0.39.
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["sqlite", "runtime-tokio"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.1"
toml = "1.2.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
minicbor = { version = "2.3.1", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
await_holding_lock = "deny"

[package]
name = "aws-inventory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
aws = ["dep:inventory-aws"]

[dependencies]
inventory-core.workspace = true
inventory-engine.workspace = true
inventory-aws = { path = "crates/aws", optional = true }
inventory-sdk-catalog = { path = "crates/sdk-catalog", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
uuid = { version = "1.29.2", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
proptest.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 0

[profile.test]
debug = 0

