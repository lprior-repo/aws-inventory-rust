[package]
name = "inventory-sdk-wire-tests"
version = "0.4.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
autotests = false

# Keep official HTTP test utilities out of the production/EC2 feature graph.
[workspace]
resolver = "3"

[[test]]
name = "resource_explorer_wire"
path = "tests/resource_explorer_wire.rs"

[dev-dependencies]
aws-sdk-resourceexplorer2 = { version = "=1.126.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "=1.5.2", default-features = false, features = ["test-util"] }
aws-smithy-types = "=1.9.4"
http = "=1.5.0"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
await_holding_lock = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0
