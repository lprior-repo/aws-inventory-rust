[package]
name = "inventory-emulator-embedded"
version = "0.0.0"
edition = "2024"
publish = false
description = "In-process AWS Emulator seam for the inventory collector. Detached workspace."

# Deliberately its own workspace. The embedded facade links the complete service
# router (AWS documents a target/ footprint on the order of 100 GB and a
# first-build cost comparable to the standalone emulator). Ordinary
# `cargo test --workspace` must never pay that cost, so this crate is excluded
# from the main workspace and built explicitly.
[workspace]

[dependencies]

[dev-dependencies]
# Same commit as the pinned standalone package in scripts/emulator/upstream.json.
aws-emulator-embedded = { git = "https://github.com/aws/aws-emulator", rev = "7461ab1bbe540afe8063ce03ee5477ebb649df48" }
aws-config = "1.13.2"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
