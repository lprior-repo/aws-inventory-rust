name: Build artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Makepad Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev libdrm-dev libgl1-mesa-dev libpulse-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev
      - name: Install the repository-pinned Rust toolchain
        run: |
          rustup show
          cargo --version
      - uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: '2.2.4'
      - run: moon ci
      - uses: actions/upload-artifact@v4
        with:
          name: aws-inventory-${{ github.ref_name }}-linux-x86_64
          if-no-files-found: error
          path: |
            target/debug/aws-inventory
            target/debug/cmdb-ui
