[package]
name = "inventory-aws"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory-core.workspace = true
inventory-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
sha2.workspace = true
base16ct.workspace = true
aws-wire = { path = "../aws-wire" }
aws-config = "1.13.2"
aws-types = "1.7.0"
aws-smithy-types = "1.9.4"
aws-sdk-sts = { version = "1.126.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1.280.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.139.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecs = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eks = { version = "1.162.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-config = { version = "1.134.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-resourceexplorer2 = { version = "1.126.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-elasticloadbalancingv2 = { version = "1.136.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudcontrol = { version = "1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1.136.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-route53 = { version = "1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudfront = { version = "1.143.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-organizations = { version = "1.140.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Keep the collector's SQS SDK version explicit for reproducible builds.
aws-sdk-sqs = { version = "=1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "=1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "=1.131.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sfn = { version = "=1.127.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "1.3.1"
percent-encoding = "2.3.2"

[dev-dependencies]
proptest.workspace = true
toml.workspace = true

[lints]
workspace = true

