[package]
name = "inventory-aws"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory-core.workspace = true
inventory-engine = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
toml = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base16ct = { workspace = true, optional = true }
aws-wire = { path = "../aws-wire" }
inventory-sweep = { path = "../sweep", optional = true }
aws-config = "1.13.2"
aws-types = "1.7.0"
aws-credential-types = "1.3.1"
aws-smithy-types = { version = "1.9.4", optional = true }
percent-encoding = "2.3.2"
aws-sdk-sts = { version = "1.126.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-ec2 = { version = "1.280.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-dynamodb = { version = "1.139.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-lambda = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-ecs = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-eks = { version = "1.162.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-config = { version = "1.134.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-resourceexplorer2 = { version = "1.126.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-elasticloadbalancingv2 = { version = "1.136.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-cloudcontrol = { version = "1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-iam = { version = "1.136.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-route53 = { version = "1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-cloudfront = { version = "1.143.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-organizations = { version = "1.140.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sqs = { version = "=1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sns = { version = "=1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-kms = { version = "=1.131.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sfn = { version = "=1.127.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }

[features]
default = ["adapters"]
sweep-credentials = ["dep:inventory-sweep"]
adapters = [
    "dep:inventory-engine",
    "dep:serde",
    "dep:toml",
    "dep:tokio",
    "dep:futures-util",
    "dep:tracing",
    "dep:sha2",
    "dep:base16ct",
    "dep:aws-smithy-types",
    "dep:aws-sdk-sts",
    "dep:aws-sdk-ec2",
    "dep:aws-sdk-dynamodb",
    "dep:aws-sdk-lambda",
    "dep:aws-sdk-ecs",
    "dep:aws-sdk-eks",
    "dep:aws-sdk-config",
    "dep:aws-sdk-resourceexplorer2",
    "dep:aws-sdk-elasticloadbalancingv2",
    "dep:aws-sdk-cloudcontrol",
    "dep:aws-sdk-s3",
    "dep:aws-sdk-iam",
    "dep:aws-sdk-route53",
    "dep:aws-sdk-cloudfront",
    "dep:aws-sdk-organizations",
    "dep:aws-sdk-sqs",
    "dep:aws-sdk-sns",
    "dep:aws-sdk-kms",
    "dep:aws-sdk-sfn",
]

[dev-dependencies]
proptest.workspace = true
toml.workspace = true
tokio.workspace = true

[lints]
workspace = true

