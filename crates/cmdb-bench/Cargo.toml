[package]
name = "cmdb-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cmdb-ui = { path = "../cmdb-ui" }
cmdb-view = { path = "../cmdb-view" }
inventory-core.workspace = true
inventory-engine = { workspace = true, default-features = false }
inventory-graph.workspace = true
aws-wire = { path = "../aws-wire" }
http = "1.5.0"
sha2.workspace = true
futures-util.workspace = true
redis = { version = "1.8.1", features = ["tokio-rustls-comp"] }
sqlx.workspace = true
tokio.workspace = true
inventory-harness = { path = "../harness" }
tokio-util.workspace = true
base16ct = { workspace = true, features = ["alloc"] }
tokio-rustls = "0.26.6"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

tempfile = "3.27.0"

[dev-dependencies]
inventory-graph = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
