format = 1
service = "ecr-public"

[[step]]
id = "repository"
operation = "CreateRepository"
kind = "AWS::ECR::PublicRepository"
identity = "repository.repositoryArn"
scope = "account"
[step.input]
repositoryName = "inventory-thin-ecr-public"

[[step]]
id = "image_upload"
operation = "InitiateLayerUpload"
kind = ""
scope = "account"
[step.input]
repositoryName = { from = "repository", path = "repository.repositoryName" }

[[step]]
id = "image_config"
operation = "UploadLayerPart"
kind = ""
scope = "account"
[step.input]
repositoryName = { from = "repository", path = "repository.repositoryName" }
uploadId = { from = "image_upload", path = "uploadId" }
partFirstByte = 0
partLastByte = 89
layerPartBlob = "eyJhcmNoaXRlY3R1cmUiOiJhbWQ2NCIsIm9zIjoibGludXgiLCJjb25maWciOnt9LCJyb290ZnMiOnsidHlwZSI6ImxheWVycyIsImRpZmZfaWRzIjpbXX19"

[[step]]
