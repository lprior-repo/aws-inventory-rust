format = 1
service = "voice-id"

[[step]]
id = "resource"
operation = "CreateDomain"
kind = "AWS::VoiceID::Domain"
identity = "Domain.Arn"
[step.input]
"Name" = "inventory-thin-voice-id"
"ServerSideEncryptionConfiguration" = { "KmsKeyId" = "inventory-thin-voice-id" }

[[step]]
id = "watchlist"
operation = "CreateWatchlist"
kind = ""
[step.input]
DomainId = { from = "resource", path = "Domain.DomainId" }
Name = "inventory-seed-watchlist"
