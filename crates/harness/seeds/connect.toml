format = 1
service = "connect"

[[step]]
id = "instance"
operation = "CreateInstance"
kind = "AWS::Connect::Instance"
identity = "Arn"
[step.input]
IdentityManagementType = "CONNECT_MANAGED"
InstanceAlias = "inventory-thin-connect"
InboundCallsEnabled = false
OutboundCallsEnabled = false

[[step]]
id = "default-flows"
operation = "ListContactFlows"
kind = "AWS::Connect::ContactFlow"
identity = { list = "ContactFlowSummaryList", member = "Arn", count = 9 }
[step.input]
InstanceId = { from = "instance", path = "Id" }
MaxResults = 100
