format = 1
service = "resource-explorer-2"

[[step]]
id = "resource"
operation = "CreateResourceExplorerSetup"
kind = ""
[step.input]
"RegionList" = ["us-east-1"]
ViewName = "all-resources"

[[step]]
id = "view"
operation = "ListViews"
kind = "AWS::ResourceExplorer2::View"
# A fresh setup creates exactly one default all-resources view.
identity = "Views.0"
[step.input]
MaxResults = 50
