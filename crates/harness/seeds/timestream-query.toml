format = 1
service = "timestream-query"

[[step]]
id = "resource"
operation = "CreateScheduledQuery"
kind = "AWS::TimestreamQuery::ScheduledQuery"
identity = "Arn"
[step.input]
"Name" = "inventory-thin-timestream-query"
