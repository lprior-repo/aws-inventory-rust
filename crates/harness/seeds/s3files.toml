format = 1
service = "s3files"

[[step]]
id = "bucket"
service = "s3"
operation = "CreateBucket"
kind = ""
[step.input]
Bucket = "inventory-seed-s3-files"

[[step]]
id = "role"
service = "iam"
operation = "CreateRole"
kind = ""
[step.input]
RoleName = "inventory-seed-s3-files"
AssumeRolePolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"s3files.amazonaws.com"},"Action":"sts:AssumeRole"}]}'

[[step]]
id = "bucket_policy"
service = "iam"
operation = "PutRolePolicy"
kind = ""
[step.input]
RoleName = "inventory-seed-s3-files"
PolicyName = "inventory-seed-file-bucket"
PolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":"arn:aws:s3:::inventory-seed-s3-files"},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::inventory-seed-s3-files/*"}]}'

[[step]]
id = "file_system"
operation = "CreateFileSystem"
kind = "AWS::S3Files::FileSystem"
identity = "fileSystemArn"
[step.input]
bucket = "arn:aws:s3:::inventory-seed-s3-files"
roleArn = { from = "role", path = "Role.Arn" }
clientToken = "inventory-seed-s3-files"

[[step]]
id = "access_point"
operation = "CreateAccessPoint"
kind = "AWS::S3Files::AccessPoint"
identity = "accessPointArn"
[step.input]
fileSystemId = { from = "file_system", path = "fileSystemId" }
clientToken = "inventory-seed-s3-files-access-point"
