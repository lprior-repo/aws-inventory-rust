format = 1
service = "location"

[[step]]
id = "resource"
operation = "CreateGeofenceCollection"
kind = "AWS::Location::GeofenceCollection"
identity = "CollectionName"
[step.input]
"CollectionName" = "inventory-thin-location"

[[step]]
id = "tracker"
operation = "CreateTracker"
kind = "AWS::Location::Tracker"
identity = "TrackerArn"
[step.input]
TrackerName = "inventory-thin-tracker"
