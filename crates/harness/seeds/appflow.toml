format = 1
service = "appflow"

[[step]]
id = "source"
service = "s3"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
identity = { "input" = "Bucket" }
[step.input]
Bucket = "inventory-thin-appflow-source"

[[step]]
id = "target"
service = "s3"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
identity = { "input" = "Bucket" }
[step.input]
Bucket = "inventory-thin-appflow-target"

[[step]]
id = "sourcepolicy"
service = "s3"
operation = "PutBucketPolicy"
kind = ""
[step.input]
Bucket = "inventory-thin-appflow-source"
Policy = "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"appflow.amazonaws.com\"},\"Action\":[\"s3:ListBucket\",\"s3:GetBucketAcl\"],\"Resource\":\"arn:aws:s3:::inventory-thin-appflow-source\"},{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"appflow.amazonaws.com\"},\"Action\":[\"s3:GetObject\"],\"Resource\":\"arn:aws:s3:::inventory-thin-appflow-source/*\"}]}"

[[step]]
id = "targetpolicy"
service = "s3"
operation = "PutBucketPolicy"
kind = ""
[step.input]
Bucket = "inventory-thin-appflow-target"
Policy = "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"appflow.amazonaws.com\"},\"Action\":[\"s3:ListBucket\",\"s3:GetBucketAcl\"],\"Resource\":\"arn:aws:s3:::inventory-thin-appflow-target\"},{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"appflow.amazonaws.com\"},\"Action\":[\"s3:PutObject\",\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\"],\"Resource\":\"arn:aws:s3:::inventory-thin-appflow-target/*\"}]}"

[[step]]
id = "flow"
operation = "CreateFlow"
kind = "AWS::AppFlow::Flow"
identity = "flowArn"
[step.input]
flowName = "inventory-thin-appflow"
triggerConfig = { "triggerType" = "OnDemand" }
sourceFlowConfig = { "connectorType" = "S3", "sourceConnectorProperties" = { "S3" = { "bucketName" = "inventory-thin-appflow-source" } } }
destinationFlowConfigList = [{ "connectorType" = "S3", "destinationConnectorProperties" = { "S3" = { "bucketName" = "inventory-thin-appflow-target" } } }]
tasks = [{ "sourceFields" = ["id"], "taskType" = "Map", "destinationField" = "id" }]
