format = 1
service = "migrationhubstrategy"

[[step]]
id = "import_bucket"
service = "s3"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
identity = { input = "Bucket", template = "arn:{partition}:s3:::{value}" }
scope = "account"
[step.input]
Bucket = "migrationhub-strategy-inventory-thin"

[[step]]
id = "import_object"
service = "s3"
operation = "PutObject"
kind = ""
[step.input]
Bucket = "migrationhub-strategy-inventory-thin"
Key = "inventory.json"
ContentType = "application/json"
Body = ""

[[step]]
id = "import_task"
operation = "StartImportFileTask"
kind = "AWS::ApiOnly::MigrationStrategyImportFileTask"
identity = "id"
[step.input]
name = "inventory-thin-import"
S3Bucket = "migrationhub-strategy-inventory-thin"
s3key = "inventory.json"
dataSourceType = "Import"
