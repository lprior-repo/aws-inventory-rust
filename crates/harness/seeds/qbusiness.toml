format = 1
service = "qbusiness"

[[step]]
id = "resource"
operation = "CreateApplication"
kind = "AWS::QBusiness::Application"
identity = "applicationId"
[step.input]
"displayName" = "inventory-thin-qbusiness"

[[step]]
id = "index"
operation = "CreateIndex"
kind = "AWS::QBusiness::Index"
identity = "indexArn"
[step.input]
applicationId = { from = "resource", path = "applicationId" }
displayName = "inventory-thin-index"
type = "STARTER"

