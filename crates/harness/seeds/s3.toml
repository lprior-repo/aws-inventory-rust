format = 1
service = "s3"

[[step]]
id = "bucket"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
identity = { input = "Bucket", template = "arn:{partition}:s3:::{value}" }
scope = "account"
repeat = 2
[step.input]
Bucket = "inventory-thin-bucket-{n}"

[[step]]
id = "directory_bucket"
operation = "CreateBucket"
kind = "AWS::S3Express::DirectoryBucket"
identity = "BucketArn"
[step.input]
Bucket = "inventory-seed-directory--use1-az1--x-s3"
CreateBucketConfiguration = { Location = { Type = "AvailabilityZone", Name = "use1-az1" }, Bucket = { DataRedundancy = "SingleAvailabilityZone", Type = "Directory" } }
