format = 1
service = "polly"

[[step]]
id = "resource"
operation = "PutLexicon"
kind = "AWS::ApiOnly::PollyLexicon"
identity = { input = "Name", template = "arn:{partition}:polly:{region}:{account}:lexicon/{value}" }
[step.input]
"Name" = "InventoryThinPolly"
"Content" = "<lexicon version=\"1.0\" xmlns=\"http://www.w3.org/2005/01/pronunciation-lexicon\" alphabet=\"ipa\" xml:lang=\"en-US\"><lexeme><grapheme>inv</grapheme><alias>inventory</alias></lexeme></lexicon>"
