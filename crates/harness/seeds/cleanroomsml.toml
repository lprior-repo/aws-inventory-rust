format = 1
service = "cleanroomsml"

[[step]]
id = "role"
service = "iam"
operation = "CreateRole"
kind = "AWS::IAM::Role"
identity = "Role.Arn"
scope = "account"
[step.input]
RoleName = "inventory-thin-cleanroomsml"
AssumeRolePolicyDocument = "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"cleanrooms-ml.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}"

[[step]]
id = "database"
service = "glue"
operation = "CreateDatabase"
kind = "AWS::Glue::Database"
identity = { "input" = "DatabaseInput.Name" }
[step.input]
DatabaseInput = { "Name" = "inventory_thin_cleanroomsml" }

[[step]]
id = "table"
service = "glue"
operation = "CreateTable"
kind = "AWS::Glue::Table"
identity = { "input" = "TableInput.Name" }
[step.input]
DatabaseName = "inventory_thin_cleanroomsml"
TableInput = { "Name" = "interactions", "StorageDescriptor" = { "Columns" = [{ "Name" = "user_id", "Type" = "string" }, { "Name" = "item_id", "Type" = "string" }, { "Name" = "timestamp", "Type" = "bigint" }] } }

[[step]]
id = "training"
operation = "CreateTrainingDataset"
kind = "AWS::ApiOnly::CleanRoomsMLTrainingDataset"
identity = "trainingDatasetArn"
[step.input]
name = "inventory-thin-cleanroomsml"
roleArn = { "from" = "role", "path" = "Role.Arn" }
trainingData = [{ "type" = "INTERACTIONS", "inputConfig" = { "schema" = [{ "columnName" = "user_id", "columnTypes" = ["USER_ID"] }, { "columnName" = "item_id", "columnTypes" = ["ITEM_ID"] }, { "columnName" = "timestamp", "columnTypes" = ["TIMESTAMP"] }], "dataSource" = { "glueDataSource" = { "databaseName" = "inventory_thin_cleanroomsml", "tableName" = "interactions" } } } }]

[[step]]
id = "audience_model"
operation = "CreateAudienceModel"
kind = "AWS::ApiOnly::CleanRoomsMLAudienceModel"
identity = "audienceModelArn"
[step.input]
name = "inventory-seed-audience"
trainingDatasetArn = { from = "training", path = "trainingDatasetArn" }

[[step]]
id = "model_algorithm"
operation = "CreateConfiguredModelAlgorithm"
kind = "AWS::ApiOnly::CleanRoomsMLConfiguredModelAlgorithm"
identity = "configuredModelAlgorithmArn"
[step.input]
name = "inventory-seed-model-algorithm"
roleArn = { from = "role", path = "Role.Arn" }
trainingContainerConfig = { imageUri = "683313688378.dkr.ecr.us-east-1.amazonaws.com/sagemaker-xgboost:1.7-1" }
