format = 1
service = "auto-scaling"

[[step]]
id = "launch"
service = "ec2"
operation = "CreateLaunchTemplate"
kind = "AWS::EC2::LaunchTemplate"
identity = "LaunchTemplate.LaunchTemplateId"
[step.input]
LaunchTemplateName = "inventory-thin-auto-scaling"
LaunchTemplateData = { "ImageId" = "ami-12345678", "InstanceType" = "t3.nano" }

[[step]]
id = "group"
operation = "CreateAutoScalingGroup"
kind = ""
[step.input]
AutoScalingGroupName = "inventory-thin-auto-scaling"
LaunchTemplate = { "LaunchTemplateId" = { "from" = "launch", "path" = "LaunchTemplate.LaunchTemplateId" }, "Version" = "$Latest" }
MinSize = 0
MaxSize = 1
DesiredCapacity = 0
AvailabilityZones = ["us-east-1a"]

[[step]]
id = "group_identity"
operation = "DescribeAutoScalingGroups"
kind = "AWS::AutoScaling::AutoScalingGroup"
identity = "AutoScalingGroups.0.AutoScalingGroupARN"
[step.input]
AutoScalingGroupNames = ["inventory-thin-auto-scaling"]

[[step]]
id = "scaling_policy"
operation = "PutScalingPolicy"
kind = "AWS::AutoScaling::ScalingPolicy"
identity = "PolicyARN"
[step.input]
AutoScalingGroupName = "inventory-thin-auto-scaling"
PolicyName = "inventory-seed-scale-out"
PolicyType = "SimpleScaling"
AdjustmentType = "ChangeInCapacity"
ScalingAdjustment = 1
