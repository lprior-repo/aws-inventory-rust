format = 1
service = "eks"

[[step]]
id = "vpc"
service = "ec2"
operation = "CreateVpc"
kind = "AWS::EC2::VPC"
identity = "Vpc.VpcId"
[step.input]
CidrBlock = "10.42.0.0/16"

[[step]]
id = "subnet"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.1.0/24"
AvailabilityZone = "us-east-1a"

[[step]]
id = "subnet2"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.2.0/24"
AvailabilityZone = "us-east-1b"

[[step]]
id = "role"
service = "iam"
operation = "CreateRole"
kind = "AWS::IAM::Role"
identity = "Role.Arn"
scope = "account"
[step.input]
RoleName = "inventory-thin-eks"
AssumeRolePolicyDocument = "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"eks.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}"

[[step]]
id = "permissions"
service = "iam"
operation = "AttachRolePolicy"
kind = ""
[step.input]
RoleName = "inventory-thin-eks"
PolicyArn = "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"

[[step]]
id = "cluster"
operation = "CreateCluster"
kind = "AWS::EKS::Cluster"
identity = "cluster.name"
[step.input]
name = "inventory-thin-eks"
roleArn = { from = "role", path = "Role.Arn" }
resourcesVpcConfig = { subnetIds = [{ from = "subnet", path = "Subnet.SubnetId" }, { from = "subnet2", path = "Subnet.SubnetId" }] }
clientRequestToken = "12345678-1234-4234-8234-123456789abc"

[[step]]
id = "pod_role"
service = "iam"
operation = "CreateRole"
kind = "AWS::IAM::Role"
identity = "Role.Arn"
scope = "account"
[step.input]
RoleName = "inventory-seed-eks-pod"
AssumeRolePolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":["sts:AssumeRole","sts:TagSession"]}]}'

[[step]]
id = "pod_identity"
operation = "CreatePodIdentityAssociation"
kind = "AWS::EKS::PodIdentityAssociation"
identity = "association.associationArn"
[step.input]
clusterName = { from = "cluster", path = "cluster.name" }
namespace = "default"
serviceAccount = "inventory-seed"
roleArn = { from = "pod_role", path = "Role.Arn" }
