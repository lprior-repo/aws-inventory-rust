[[step]]
id = "user"
operation = "CreateUser"
kind = "AWS::IAM::User"
identity = "User.Arn"
scope = "account"
[step.input]
UserName = "inventory-seed-user"

[[step]]
id = "service_specific_credential"
operation = "CreateServiceSpecificCredential"
kind = ""
scope = "account"
[step.input]
UserName = { from = "user", path = "User.UserName" }
ServiceName = "codecommit.amazonaws.com"

[[step]]
id = "login_profile"
operation = "CreateLoginProfile"
kind = ""
scope = "account"
[step.input]
UserName = { from = "user", path = "User.UserName" }
Password = "Inventory-Emulator-Only-2026!"
PasswordResetRequired = true

[[step]]
id = "access_key"
operation = "CreateAccessKey"
kind = ""
scope = "account"
[step.input]
UserName = { from = "user", path = "User.UserName" }

[[step]]
id = "group_policy"
operation = "PutGroupPolicy"
kind = ""
scope = "account"
[step.input]
GroupName = { from = "group", path = "Group.GroupName" }
PolicyName = "inventory-seed-inline"
PolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"}]}'

[[step]]
id = "profile_membership"
operation = "AddRoleToInstanceProfile"
kind = ""
scope = "account"
[step.input]
InstanceProfileName = { from = "instance_profile", path = "InstanceProfile.InstanceProfileName" }
RoleName = { from = "role", path = "Role.RoleName" }

[[step]]
id = "policy_version"
operation = "CreatePolicyVersion"
kind = ""
scope = "account"
[step.input]
PolicyArn = { from = "policy", path = "Policy.Arn" }
PolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":"sts:GetCallerIdentity","Resource":"*"}]}'

[[step]]
id = "role_policy"
operation = "PutRolePolicy"
kind = ""
scope = "account"
[step.input]
RoleName = { from = "role", path = "Role.RoleName" }
PolicyName = "inventory-seed-inline"
PolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"}]}'

[[step]]
id = "role_tag"
operation = "TagRole"
kind = ""
scope = "account"
[step.input]
RoleName = { from = "role", path = "Role.RoleName" }
Tags = [{ Key = "inventory-fixture", Value = "iam" }]

[[step]]
id = "ssh_public_key"
operation = "UploadSSHPublicKey"
kind = ""
scope = "account"
[step.input]
UserName = { from = "user", path = "User.UserName" }
SSHPublicKeyBody = "ssh-rsa "

[[step]]
id = "user_policy"
operation = "PutUserPolicy"
kind = ""
scope = "account"
[step.input]
UserName = { from = "user", path = "User.UserName" }
PolicyName = "inventory-seed-inline"
PolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"}]}'
