format = 1
service = "iam"

[[step]]
id = "role"
operation = "CreateRole"
kind = "AWS::IAM::Role"
identity = "Role.Arn"
scope = "account"
repeat = 1000
[step.input]
RoleName = "inventory-bench-role-{n}"
AssumeRolePolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}'

[[step]]
id = "policy"
operation = "CreatePolicy"
kind = "AWS::IAM::ManagedPolicy"
identity = "Policy.Arn"
scope = "account"
repeat = 1001
[step.input]
PolicyName = "inventory-bench-policy-{n}"
PolicyDocument = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"}]}'

[[step]]
id = "profile"
operation = "CreateInstanceProfile"
kind = "AWS::IAM::InstanceProfile"
identity = "InstanceProfile.Arn"
scope = "account"
repeat = 1000
[step.input]
InstanceProfileName = "inventory-bench-profile-{n}"
