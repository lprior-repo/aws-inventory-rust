format = 1
service = "accessanalyzer"

[[step]]
id = "resource"
operation = "CreateAnalyzer"
kind = "AWS::AccessAnalyzer::Analyzer"
identity = "arn"
[step.input]
"analyzerName" = "inventory-thin-accessanalyzer"
"type" = "ACCOUNT"

# Archive rule identity is correlated with the analyzer ARN.
[[step]]
id = "archive_rule"
operation = "CreateArchiveRule"
kind = ""
[step.input]
analyzerName = "inventory-thin-accessanalyzer"
ruleName = "inventory-seed-archive"
filter = { isPublic = { eq = ["false"] } }
