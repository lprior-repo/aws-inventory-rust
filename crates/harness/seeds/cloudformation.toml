format = 1
service = "cloudformation"

[[step]]
id = "resource"
operation = "CreateGeneratedTemplate"
kind = "AWS::ApiOnly::CloudFormationGeneratedTemplate"
identity = "GeneratedTemplateId"
[step.input]
"GeneratedTemplateName" = "inventory-thin-cloudformation"

[[step]]
id = "createstack"
operation = "CreateStack"
kind = "AWS::CloudFormation::Stack"
identity = "StackId"
scope = "region"

[step.input]
StackName = "inv-createstack-{n}"
TemplateBody = "{}"

[[step]]
id = "createstackset"
operation = "CreateStackSet"
kind = "AWS::CloudFormation::StackSet"
identity = "StackSetId"
scope = "region"

[step.input]
StackSetName = "inv-createstackset-{n}"
TemplateBody = "{}"

[[step]]
id = "resource_scan"
operation = "StartResourceScan"
kind = "AWS::ApiOnly::CloudFormationResourceScan"
identity = "ResourceScanId"

[[step]]
id = "registry_bucket"
service = "s3"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
identity = { input = "Bucket", template = "arn:{partition}:s3:::{value}" }
scope = "account"
[step.input]
Bucket = "inventory-seed-cloudformation-registry"

[[step]]
id = "registry_package"
service = "s3"
operation = "PutObject"
kind = ""
[step.input]
Bucket = "inventory-seed-cloudformation-registry"
Key = "schema.zip"
# ZIP containing the InventorySeed::Emulator::Fixture resource schema.
Body = ""

[[step]]
id = "register_type"
operation = "RegisterType"
kind = ""
[step.input]
Type = "RESOURCE"
TypeName = "InventorySeed::Emulator::Fixture"
SchemaHandlerPackage = "s3://inventory-seed-cloudformation-registry/schema.zip"

[[step]]
id = "registry_type"
operation = "DescribeType"
kind = "AWS::ApiOnly::CloudFormationRegistryType"
identity = "Arn"
[step.input]
Type = "RESOURCE"
TypeName = "InventorySeed::Emulator::Fixture"
