format = 1
service = "cognito-identity-provider"

[[step]]
id = "pool"
operation = "CreateUserPool"
kind = "AWS::Cognito::UserPool"
identity = "UserPool.Id"
[step.input]
PoolName = "inventory-thin-cognito-identity-provider"

[[step]]
id = "group"
operation = "CreateGroup"
kind = ""
[step.input]
UserPoolId = { from = "pool", path = "UserPool.Id" }
GroupName = "inventory-seed-users"

[[step]]
id = "resource_server"
operation = "CreateResourceServer"
kind = ""
[step.input]
UserPoolId = { from = "pool", path = "UserPool.Id" }
Identifier = "https://inventory.example/resource"
Name = "Inventory Seed Resource"
Scopes = [{ ScopeName = "read", ScopeDescription = "Read fixture data" }]

[[step]]
id = "pool_client"
operation = "CreateUserPoolClient"
kind = ""
[step.input]
UserPoolId = { from = "pool", path = "UserPool.Id" }
ClientName = "inventory-seed-client"

[[step]]
id = "terms"
operation = "CreateTerms"
kind = ""
[step.input]
UserPoolId = { from = "pool", path = "UserPool.Id" }
ClientId = { from = "pool_client", path = "UserPoolClient.ClientId" }
TermsName = "terms-of-use"
TermsSource = "LINK"
Enforcement = "NONE"
Links = { "cognito:default" = "https://inventory.example/terms" }

[[step]]
id = "identity_provider"
operation = "CreateIdentityProvider"
kind = ""
[step.input]
UserPoolId = { from = "pool", path = "UserPool.Id" }
ProviderName = "Google"
ProviderType = "Google"
ProviderDetails = { client_id = "inventory-seed.apps.googleusercontent.com", client_secret = "emulator-fixture", authorize_scopes = "openid email profile" }
AttributeMapping = { email = "email" }
