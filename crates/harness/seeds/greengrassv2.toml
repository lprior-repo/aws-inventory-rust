format = 1
service = "greengrassv2"

[[step]]
id = "component"
operation = "CreateComponentVersion"
kind = "AWS::GreengrassV2::ComponentVersion"
identity = "arn"
[step.input]
inlineRecipe = ""
clientToken = "12345678-1234-4234-8234-123456789abc"

[[step]]
id = "deployment_target"
service = "iot"
operation = "CreateThing"
kind = "AWS::IoT::Thing"
identity = "thingArn"
[step.input]
thingName = "inventory-seed-greengrass"

[[step]]
id = "deployment"
operation = "CreateDeployment"
kind = "AWS::GreengrassV2::Deployment"
identity = "deploymentId"
[step.input]
targetArn = { from = "deployment_target", path = "thingArn" }
deploymentName = "inventory-seed-deployment"
components = { "com.inventory.seed" = { componentVersion = "1.0.0" } }
clientToken = "inventory-seed-greengrass-deployment"
