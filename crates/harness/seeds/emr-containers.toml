format = 1
service = "emr-containers"

[[step]]
id = "vpc"
service = "ec2"
operation = "CreateVpc"
kind = "AWS::EC2::VPC"
identity = "Vpc.VpcId"
[step.input]
CidrBlock = "10.42.0.0/16"

[[step]]
id = "subnet"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.1.0/24"
AvailabilityZone = "us-east-1a"

[[step]]
id = "subnet2"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.2.0/24"
AvailabilityZone = "us-east-1b"

[[step]]
id = "role"
service = "iam"
operation = "CreateRole"
kind = "AWS::IAM::Role"
identity = "Role.Arn"
[step.input]
RoleName = "inventory-thin-emr-eks"
AssumeRolePolicyDocument = "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"eks.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}"

[[step]]
id = "permissions"
service = "iam"
operation = "AttachRolePolicy"
kind = ""
[step.input]
RoleName = "inventory-thin-emr-eks"
PolicyArn = "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"

[[step]]
id = "cluster"
service = "eks"
operation = "CreateCluster"
kind = "AWS::EKS::Cluster"
identity = "cluster.arn"
[step.input]
name = "inventory-thin-emr-eks"
roleArn = { from = "role", path = "Role.Arn" }
resourcesVpcConfig = { subnetIds = [{ from = "subnet", path = "Subnet.SubnetId" }, { from = "subnet2", path = "Subnet.SubnetId" }] }
clientRequestToken = "12345678-1234-4234-8234-123456789abd"

[[step]]
id = "virtual"
operation = "CreateVirtualCluster"
kind = "AWS::EMRContainers::VirtualCluster"
identity = "arn"
[step.input]
name = "inventory-thin-emr-containers"
clientToken = "12345678-1234-4234-8234-123456789abc"
containerProvider = { id = { from = "cluster", path = "cluster.name" }, type = "EKS", info = { eksInfo = { namespace = "default" } } }
