format = 1
service = "bcm-data-exports"

[[step]]
id = "bucket"
service = "s3"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
identity = { input = "Bucket" }
[step.input]
Bucket = "inventory-thin-bcm-data-exports"

[[step]]
id = "policy"
service = "s3"
operation = "PutBucketPolicy"
kind = ""
[step.input]
Bucket = "inventory-thin-bcm-data-exports"
Policy = "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"bcm-data-exports.amazonaws.com\",\"billingreports.amazonaws.com\"]},\"Action\":[\"s3:GetBucketAcl\",\"s3:GetBucketPolicy\"],\"Resource\":\"arn:aws:s3:::inventory-thin-bcm-data-exports\"},{\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"bcm-data-exports.amazonaws.com\",\"billingreports.amazonaws.com\"]},\"Action\":\"s3:PutObject\",\"Resource\":\"arn:aws:s3:::inventory-thin-bcm-data-exports/*\"}]}"

[[step]]
id = "export"
operation = "CreateExport"
kind = "AWS::BCMDataExports::Export"
identity = "ExportArn"
[step.input]
Export = { Name = "inventory-thin-bcm-data-exports", DataQuery = { QueryStatement = "SELECT identity_line_item_id FROM COST_AND_USAGE_REPORT" }, DestinationConfigurations = { S3Destination = { S3Bucket = "inventory-thin-bcm-data-exports", S3Prefix = "reports", S3Region = "us-east-1", S3OutputConfigurations = { OutputType = "CUSTOM", Format = "TEXT_OR_CSV", Compression = "GZIP", Overwrite = "CREATE_NEW_REPORT" } } }, RefreshCadence = { Frequency = "SYNCHRONOUS" } }
