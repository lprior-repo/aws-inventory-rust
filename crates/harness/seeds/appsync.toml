format = 1
service = "appsync"

[[step]]
id = "resource"
operation = "CreateApi"
kind = "AWS::AppSync::Api"
identity = "api.apiArn"
[step.input]
"name" = "inventory-thin-appsync"
"eventConfig" = { "authProviders" = [{ "authType" = "API_KEY" }], "connectionAuthModes" = [{ "authType" = "API_KEY" }], "defaultPublishAuthModes" = [{ "authType" = "API_KEY" }], "defaultSubscribeAuthModes" = [{ "authType" = "API_KEY" }] }

[[step]]
id = "graphql_api"
operation = "CreateGraphqlApi"
kind = "AWS::AppSync::GraphQLApi"
identity = "graphqlApi.arn"
scope = "region"
[step.input]
authenticationType = "API_KEY"
name = "inventory-seed-graphql-api"

[[step]]
id = "domain_certificate"
service = "acm"
operation = "RequestCertificate"
kind = ""
[step.input]
DomainName = "inventory-appsync.example.com"
ValidationMethod = "DNS"

[[step]]
id = "domain"
operation = "CreateDomainName"
kind = "AWS::AppSync::DomainName"
identity = "domainNameConfig.domainName"
[step.input]
domainName = "inventory-appsync.example.com"
certificateArn = { from = "domain_certificate", path = "CertificateArn" }

[[step]]
id = "channel_namespace"
operation = "CreateChannelNamespace"
kind = "AWS::AppSync::ChannelNamespace"
identity = "channelNamespace.channelNamespaceArn"
[step.input]
apiId = { from = "resource", path = "api.apiId" }
name = "inventory"
