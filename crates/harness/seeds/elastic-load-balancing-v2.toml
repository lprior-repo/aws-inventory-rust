format = 1
service = "elastic-load-balancing-v2"

[[step]]
id = "vpc"
service = "ec2"
operation = "CreateVpc"
kind = "AWS::EC2::VPC"
identity = "Vpc.VpcId"
[step.input]
CidrBlock = "10.42.0.0/16"

[[step]]
id = "target"
operation = "CreateTargetGroup"
kind = "AWS::ElasticLoadBalancingV2::TargetGroup"
identity = "TargetGroups.0.TargetGroupArn"
[step.input]
Name = "inventory-seed-target"
Protocol = "HTTP"
Port = 80
TargetType = "ip"
VpcId = { from = "vpc", path = "Vpc.VpcId" }

[[step]]
id = "subnet_a"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.1.0/24"
AvailabilityZone = "us-east-1a"

[[step]]
id = "subnet_b"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.2.0/24"
AvailabilityZone = "us-east-1b"

[[step]]
id = "load_balancer"
operation = "CreateLoadBalancer"
kind = "AWS::ElasticLoadBalancingV2::LoadBalancer"
identity = "LoadBalancers.0.LoadBalancerArn"
[step.input]
Name = "inventory-seed-alb"
Type = "application"
Scheme = "internal"
Subnets = [{ from = "subnet_a", path = "Subnet.SubnetId" }, { from = "subnet_b", path = "Subnet.SubnetId" }]

[[step]]
id = "trust_store_bucket"
service = "s3"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
identity = { input = "Bucket", template = "arn:{partition}:s3:::{value}" }
scope = "account"
[step.input]
Bucket = "inventory-seed-elbv2-trust"

[[step]]
id = "trust_store_bundle"
service = "s3"
operation = "PutObject"
kind = ""
[step.input]
Bucket = "inventory-seed-elbv2-trust"
Key = "ca.pem"
Body = ""

[[step]]
id = "trust_store"
operation = "CreateTrustStore"
kind = "AWS::ElasticLoadBalancingV2::TrustStore"
identity = "TrustStores.0.TrustStoreArn"
[step.input]
Name = "inventory-seed-trust"
CaCertificatesBundleS3Bucket = "inventory-seed-elbv2-trust"
CaCertificatesBundleS3Key = "ca.pem"
