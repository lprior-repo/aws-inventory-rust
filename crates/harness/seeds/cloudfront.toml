[[step]]
id = "createresponseheaderspolicy"
operation = "CreateResponseHeadersPolicy"
kind = "AWS::CloudFront::ResponseHeadersPolicy"
identity = "ResponseHeadersPolicy.Id"
scope = "account"

[step.input.ResponseHeadersPolicyConfig]
Name = "inv-createresponseheaderspolicy-{n}"
