format = 1
service = "cloudfront"
[[step]]
id = "createcachepolicy"
operation = "CreateCachePolicy"
kind = "AWS::CloudFront::CachePolicy"
identity = "CachePolicy.Id"
scope = "account"

[step.input.CachePolicyConfig]
MinTTL = 1
Name = "inv-createcachepolicy-{n}"
[[step]]
id = "createcloudfrontoriginaccessidentity"
operation = "CreateCloudFrontOriginAccessIdentity"
kind = "AWS::CloudFront::CloudFrontOriginAccessIdentity"
identity = "CloudFrontOriginAccessIdentity.Id"
scope = "account"

[step.input.CloudFrontOriginAccessIdentityConfig]
CallerReference = "inv-createcloudfrontoriginaccessidentity-{n}"
Comment = "inv-createcloudfrontoriginaccessidentity-{n}"
# Disabled: create identifier matches multiple enumeration kinds
# [[step]]
# id = "createconnectionfunction"
# operation = "CreateConnectionFunction"
# kind = "AWS::CloudFront::CachePolicy"
# identity = "ConnectionFunctionSummary.Id"
# scope = "account"
[[step]]
id = "createconnectiongroup"
operation = "CreateConnectionGroup"
kind = "AWS::CloudFront::ConnectionGroup"
identity = "ConnectionGroup.Arn"
scope = "account"

[step.input]
Name = "inv-createconnectiongroup-{n}"
[[step]]
id = "createkeygroup"
operation = "CreateKeyGroup"
kind = "AWS::CloudFront::KeyGroup"
identity = "KeyGroup.Id"
scope = "account"

[step.input.KeyGroupConfig]
Items = ["inv-createkeygroup-{n}"]
Name = "inv-createkeygroup-{n}"
[[step]]
id = "createkeyvaluestore"
operation = "CreateKeyValueStore"
kind = "AWS::CloudFront::KeyValueStore"
identity = "KeyValueStore.ARN"
scope = "account"

[step.input]
Name = "inv-createkeyvaluestore-{n}"
[[step]]
id = "createoriginaccesscontrol"
operation = "CreateOriginAccessControl"
kind = "AWS::CloudFront::OriginAccessControl"
identity = "OriginAccessControl.Id"
scope = "account"

[step.input.OriginAccessControlConfig]
Name = "inv-createoriginaccesscontrol-{n}"
OriginAccessControlOriginType = "lambda"
SigningBehavior = "always"
SigningProtocol = "sigv4"
[[step]]
id = "createoriginrequestpolicy"
operation = "CreateOriginRequestPolicy"
kind = "AWS::CloudFront::OriginRequestPolicy"
identity = "OriginRequestPolicy.Id"
scope = "account"

[step.input.OriginRequestPolicyConfig]
Name = "inv-createoriginrequestpolicy-{n}"

[step.input.OriginRequestPolicyConfig.CookiesConfig]
CookieBehavior = "all"

[step.input.OriginRequestPolicyConfig.HeadersConfig]
HeaderBehavior = "allExcept"

[step.input.OriginRequestPolicyConfig.QueryStringsConfig]
QueryStringBehavior = "all"
