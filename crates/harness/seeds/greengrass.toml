format = 1
service = "greengrass"

[[step]]
id = "resource"
operation = "CreateGroup"
kind = "AWS::Greengrass::Group"
identity = "Arn"
[step.input]
"Name" = "inventory-thin-greengrass"

[[step]]
id = "group_version"
operation = "CreateGroupVersion"
kind = "AWS::Greengrass::GroupVersion"
identity = "Arn"
[step.input]
GroupId = { from = "resource", path = "Id" }
