format = 1
service = "lex-models-v2"

[[step]]
id = "resource"
operation = "CreateBot"
kind = "AWS::Lex::Bot"
identity = "botId"
[step.input]
"botName" = "inventory-thin-lex-models-v2"
"roleArn" = "arn:aws:iam::000000000000:role/inventory-thin"
"dataPrivacy" = { "childDirected" = false }
"idleSessionTTLInSeconds" = 60

[[step]]
id = "locale"
operation = "CreateBotLocale"
kind = ""
[step.input]
botId = { from = "resource", path = "botId" }
botVersion = "DRAFT"
localeId = "en_US"
nluIntentConfidenceThreshold = 0.4

[[step]]
id = "locale_build"
operation = "BuildBotLocale"
kind = ""
[step.input]
botId = { from = "resource", path = "botId" }
botVersion = "DRAFT"
localeId = "en_US"

[[step]]
id = "bot_version"
operation = "CreateBotVersion"
kind = ""
[step.input]
botId = { from = "resource", path = "botId" }
botVersionLocaleSpecification = { en_US = { sourceBotVersion = "DRAFT" } }
