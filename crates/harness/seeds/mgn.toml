format = 1
service = "mgn"

[[step]]
id = "initialize"
operation = "InitializeService"
kind = ""

[[step]]
id = "application"
operation = "CreateApplication"
kind = "AWS::MGN::Application"
identity = "arn"
[step.input]
name = "inventory-thin-mgn-application"

[[step]]
id = "wave"
operation = "CreateWave"
kind = "AWS::MGN::Wave"
