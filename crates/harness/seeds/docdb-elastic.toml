format = 1
service = "docdb-elastic"

[[step]]
id = "vpc"
service = "ec2"
operation = "CreateVpc"
kind = "AWS::EC2::VPC"
identity = "Vpc.VpcId"
[step.input]
CidrBlock = "10.42.0.0/16"

[[step]]
id = "subnet"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.1.0/24"
AvailabilityZone = "us-east-1a"

[[step]]
id = "subnet2"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = "Subnet.SubnetId"
[step.input]
VpcId = { from = "vpc", path = "Vpc.VpcId" }
CidrBlock = "10.42.2.0/24"
AvailabilityZone = "us-east-1b"

[[step]]
id = "cluster"
operation = "CreateCluster"
kind = "AWS::DocDBElastic::Cluster"
identity = "cluster.clusterArn"
[step.input]
clusterName = "inventory-thin-docdb-elastic"
authType = "PLAIN_TEXT"
adminUserName = "inventoryadmin"
adminUserPassword = "InventorySecret123!"
shardCapacity = 2
shardCount = 1
subnetIds = [{ from = "subnet", path = "Subnet.SubnetId" }, { from = "subnet2", path = "Subnet.SubnetId" }]
