format = 1
service = "codeguru-reviewer"

[[step]]
id = "repository"
service = "codecommit"
operation = "CreateRepository"
kind = "AWS::CodeCommit::Repository"
identity = "repositoryMetadata.Arn"
[step.input]
repositoryName = "inventory-thin-codeguru-reviewer"

[[step]]
id = "association"
operation = "AssociateRepository"
kind = "AWS::CodeGuruReviewer::RepositoryAssociation"
identity = "RepositoryAssociation.AssociationArn"
[step.input]
Repository = { "CodeCommit" = { "Name" = "inventory-thin-codeguru-reviewer" } }
ClientRequestToken = "12345678-1234-4234-8234-123456789abc"
