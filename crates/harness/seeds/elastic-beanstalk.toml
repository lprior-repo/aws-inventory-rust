format = 1
service = "elastic-beanstalk"

[[step]]
id = "resource"
operation = "CreateApplication"
kind = "AWS::ElasticBeanstalk::Application"
identity = "Application.ApplicationArn"
[step.input]
"ApplicationName" = "inventory-thin-elastic-beanstalk"
[[step]]
id = "createapplicationversion"
operation = "CreateApplicationVersion"
kind = "AWS::ElasticBeanstalk::ApplicationVersion"
identity = "ApplicationVersion.ApplicationVersionArn"
scope = "region"

[step.input]
ApplicationName = "inventory-thin-elastic-beanstalk"
VersionLabel = "inventory-thin-version"

[[step]]
id = "solution_stacks"
operation = "ListAvailableSolutionStacks"
kind = ""

[[step]]
id = "environment"
operation = "CreateEnvironment"
kind = "AWS::ElasticBeanstalk::Environment"
identity = "EnvironmentArn"
[step.input]
ApplicationName = { from = "resource", path = "Application.ApplicationName" }
VersionLabel = { from = "createapplicationversion", path = "ApplicationVersion.VersionLabel" }
EnvironmentName = "inventory-seed-environment"
SolutionStackName = { from = "solution_stacks", path = "SolutionStacks.0" }
OptionSettings = [{ Namespace = "aws:elasticbeanstalk:environment", OptionName = "EnvironmentType", Value = "SingleInstance" }]
