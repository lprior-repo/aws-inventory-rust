format = 1

# LOCAL emulator only; use --region us-east-1. Omitting a location constraint
# creates these general-purpose buckets in us-east-1. No objects are created,
# listed, read, copied, or exported; default private access is unchanged.
# CreateBucket returns Location, not a canonical general-purpose bucket ARN.
# This scenario therefore REQUIRES the generic request-derived identity and
# account-scope extension: ARN provenance is the sent Bucket input, not a
# fabricated BucketArn response. scope=account must produce Region::Global keys
# matching ListBuckets, while the wire request still uses the configured region.
# No response check equates Location (/name or URL) with a bucket name or ARN.
# Rich bucket configuration/edges remain deferred in the isolated S3 overlay.

[[steps]]
id = 0
service = "s3"
operation = "CreateBucket"
kind = "AWS::S3::Bucket"
scope = "account"
identity_source = { input_field = ["Bucket"], template = "arn:{partition}:s3:::{value}" }
inputs = [{ field = ["Bucket"], value = "inventory-seed-empty-bucket-a" }]

