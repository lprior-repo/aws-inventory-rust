format = 1

# Metadata-only network resources for the LOCAL emulator.
# Only Subnet -> VPC is a reviewed native relationship in catalog/kinds.tsv.
# CreateSecurityGroup does not return VpcId; no response-derived edge is invented.
# RouteTable -> VPC awaits a reviewed native kind/relationship mapping.

[[steps]]
id = 0
service = "ec2"
operation = "CreateVpc"
kind = "AWS::EC2::VPC"
identity = ["Vpc", "VpcId"]
inputs = [{ field = ["CidrBlock"], value = "10.89.0.0/16" }]
response_checks = [{ path = ["Vpc", "CidrBlock"], input_field = ["CidrBlock"] }]

[[steps]]
id = 1
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = ["Subnet", "SubnetId"]
inputs = [
  { field = ["VpcId"], from_step = 0, from_path = ["Vpc", "VpcId"] },
  { field = ["CidrBlock"], value = "10.89.1.0/24" },
]
response_checks = [
  { path = ["Subnet", "VpcId"], input_field = ["VpcId"] },
  { path = ["Subnet", "CidrBlock"], input_field = ["CidrBlock"] },
]

[[steps]]
id = 2
service = "ec2"
operation = "CreateSecurityGroup"
kind = "AWS::EC2::SecurityGroup"
identity = ["GroupId"]
inputs = [
  { field = ["VpcId"], from_step = 0, from_path = ["Vpc", "VpcId"] },
  { field = ["GroupName"], value = "inventory-seed-network" },
  { field = ["Description"], value = "Local emulator inventory seed security group" },
]

[[steps]]
id = 3
service = "ec2"
operation = "CreateRouteTable"
kind = "AWS::EC2::RouteTable"
identity = ["RouteTable", "RouteTableId"]
inputs = [{ field = ["VpcId"], from_step = 0, from_path = ["Vpc", "VpcId"] }]
response_checks = [{ path = ["RouteTable", "VpcId"], input_field = ["VpcId"] }]

[[relationships]]
source = 1
target = 0
relation = "IN_VPC"
observed_path = ["Subnet", "VpcId"]
