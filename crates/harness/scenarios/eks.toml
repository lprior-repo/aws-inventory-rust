format = 1

# Local emulator fixture: resolve two real zones for the configured region.
# CreateCluster resolves real EC2 subnets and requires an in-account role ARN.
# No node groups, workloads, credentials, or connector registration are created.
# This uses account-scoped steps and nested prior-output refs in the shared seeder.
# EKS collection remains subject to the overlay's scalar-list and secret-field gates.
[[steps]]
id = 0
service = "ec2"
operation = "DescribeAvailabilityZones"
resource = false

[[steps]]
id = 1
service = "iam"
operation = "CreateRole"
kind = "AWS::IAM::Role"
scope = "account"
identity = ["Role", "Arn"]
inputs = [
  { field = ["RoleName"], value = "inventory-seed-eks-control-plane" },
  { field = ["AssumeRolePolicyDocument"], value = '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"eks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' },
]
response_checks = [{ path = ["Role", "RoleName"], input_field = ["RoleName"] }]

[[steps]]
id = 2
service = "ec2"
operation = "CreateVpc"
kind = "AWS::EC2::VPC"
identity = ["Vpc", "VpcId"]
inputs = [{ field = ["CidrBlock"], value = "10.89.0.0/16" }]
response_checks = [{ path = ["Vpc", "CidrBlock"], input_field = ["CidrBlock"] }]

[[steps]]
id = 3
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = ["Subnet", "SubnetId"]
inputs = [
  { field = ["VpcId"], from_step = 2, from_path = ["Vpc", "VpcId"] },
  { field = ["CidrBlock"], value = "10.89.1.0/24" },
  { field = ["AvailabilityZone"], from_step = 0, from_path = ["AvailabilityZones", "0", "ZoneName"] },
]
response_checks = [
  { path = ["Subnet", "VpcId"], input_field = ["VpcId"] },
  { path = ["Subnet", "CidrBlock"], input_field = ["CidrBlock"] },
  { path = ["Subnet", "AvailabilityZone"], input_field = ["AvailabilityZone"] },
]

[[steps]]
id = 4
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = ["Subnet", "SubnetId"]
inputs = [
  { field = ["VpcId"], from_step = 2, from_path = ["Vpc", "VpcId"] },
  { field = ["CidrBlock"], value = "10.89.2.0/24" },
  { field = ["AvailabilityZone"], from_step = 0, from_path = ["AvailabilityZones", "1", "ZoneName"] },
]
response_checks = [
  { path = ["Subnet", "VpcId"], input_field = ["VpcId"] },
  { path = ["Subnet", "CidrBlock"], input_field = ["CidrBlock"] },
  { path = ["Subnet", "AvailabilityZone"], input_field = ["AvailabilityZone"] },
]

[[steps]]
id = 5
service = "eks"
operation = "CreateCluster"
kind = "AWS::EKS::Cluster"
identity = ["cluster", "arn"]
inputs = [
  { field = ["name"], value = "inventory-seed-eks" },
  { field = ["roleArn"], from_step = 1, from_path = ["Role", "Arn"] },
  { field = ["resourcesVpcConfig", "subnetIds"], value = [{ from_step = 3, from_path = ["Subnet", "SubnetId"] }, { from_step = 4, from_path = ["Subnet", "SubnetId"] }] },
  { field = ["resourcesVpcConfig", "endpointPublicAccess"], value = false },
  { field = ["resourcesVpcConfig", "endpointPrivateAccess"], value = true },
]
response_checks = [
  { path = ["cluster", "name"], input_field = ["name"] },
  { path = ["cluster", "roleArn"], input_field = ["roleArn"] },
  { path = ["cluster", "resourcesVpcConfig", "subnetIds"], input_field = ["resourcesVpcConfig", "subnetIds"] },
  { path = ["cluster", "resourcesVpcConfig", "endpointPublicAccess"], input_field = ["resourcesVpcConfig", "endpointPublicAccess"] },
  { path = ["cluster", "resourcesVpcConfig", "endpointPrivateAccess"], input_field = ["resourcesVpcConfig", "endpointPrivateAccess"] },
]

# Only currently reviewed runtime relationships are asserted. EKS IN_VPC,
# USES_SUBNET and ASSUMES_ROLE require reviewed canonical relationship mappings.
[[relationships]]
source = 3
target = 2
relation = "IN_VPC"
observed_path = ["Subnet", "VpcId"]

[[relationships]]
source = 4
target = 2
relation = "IN_VPC"
observed_path = ["Subnet", "VpcId"]
