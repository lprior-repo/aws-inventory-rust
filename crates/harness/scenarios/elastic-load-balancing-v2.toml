format = 1

# LOCAL emulator only; use --region us-east-1 for these explicit AZ names.
# Requires generic nested output references and numeric output-list selectors.
# Every VPC, subnet, security-group and ELB identity comes from an actual response.
# Only Subnet -> VPC is currently a reviewed native relationship.
# Listener/rule discovery is denied by the overlay's reachable OIDC-secret policy.

[[steps]]
id = 0
name = "vpc"
service = "ec2"
operation = "CreateVpc"
kind = "AWS::EC2::VPC"
identity = ["Vpc", "VpcId"]
inputs = [{ field = ["CidrBlock"], value = "10.90.0.0/16" }]
response_checks = [{ path = ["Vpc", "CidrBlock"], input_field = ["CidrBlock"] }]

[[steps]]
id = 1
name = "subnetA"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = ["Subnet", "SubnetId"]
inputs = [
  { field = ["VpcId"], from_step = 0, from_path = ["Vpc", "VpcId"] },
  { field = ["CidrBlock"], value = "10.90.1.0/24" },
  { field = ["AvailabilityZone"], value = "us-east-1a" },
]
response_checks = [
  { path = ["Subnet", "VpcId"], input_field = ["VpcId"] },
  { path = ["Subnet", "CidrBlock"], input_field = ["CidrBlock"] },
  { path = ["Subnet", "AvailabilityZone"], input_field = ["AvailabilityZone"] },
]

[[steps]]
id = 2
name = "subnetB"
service = "ec2"
operation = "CreateSubnet"
kind = "AWS::EC2::Subnet"
identity = ["Subnet", "SubnetId"]
inputs = [
  { field = ["VpcId"], from_step = 0, from_path = ["Vpc", "VpcId"] },
  { field = ["CidrBlock"], value = "10.90.2.0/24" },
  { field = ["AvailabilityZone"], value = "us-east-1b" },
]
response_checks = [
  { path = ["Subnet", "VpcId"], input_field = ["VpcId"] },
  { path = ["Subnet", "CidrBlock"], input_field = ["CidrBlock"] },
  { path = ["Subnet", "AvailabilityZone"], input_field = ["AvailabilityZone"] },
]

[[steps]]
id = 3
name = "securityGroup"
service = "ec2"
operation = "CreateSecurityGroup"
kind = "AWS::EC2::SecurityGroup"
identity = ["GroupId"]
inputs = [
  { field = ["VpcId"], from_step = 0, from_path = ["Vpc", "VpcId"] },
  { field = ["GroupName"], value = "inventory-seed-elbv2" },
  { field = ["Description"], value = "Local emulator load balancer security group" },
]

[[steps]]
id = 4
service = "elastic-load-balancing-v2"
operation = "CreateLoadBalancer"
kind = "AWS::ElasticLoadBalancingV2::LoadBalancer"
identity = ["LoadBalancers", "0", "LoadBalancerArn"]
inputs = [
  { field = ["Name"], value = "inventory-seed-alb" },
  { field = ["Subnets"], value = [{ from_step = "subnetA", from_path = "Subnet.SubnetId" }, { from_step = "subnetB", from_path = "Subnet.SubnetId" }] },
  { field = ["SecurityGroups"], value = [{ from_step = "securityGroup", from_path = "GroupId" }] },
  { field = ["Scheme"], value = "internal" },
  { field = ["Type"], value = "application" },
]
response_checks = [
  { path = ["LoadBalancers", "0", "LoadBalancerName"], input_field = ["Name"] },
  { path = ["LoadBalancers", "0", "SecurityGroups"], input_field = ["SecurityGroups"] },
  { path = ["LoadBalancers", "0", "Scheme"], input_field = ["Scheme"] },
  { path = ["LoadBalancers", "0", "Type"], input_field = ["Type"] },
]

[[steps]]
id = 5
service = "elastic-load-balancing-v2"
operation = "CreateTargetGroup"
kind = "AWS::ElasticLoadBalancingV2::TargetGroup"
identity = ["TargetGroups", "0", "TargetGroupArn"]
inputs = [
  { field = ["Name"], value = "inventory-seed-targets" },
  { field = ["Protocol"], value = "HTTP" },
  { field = ["Port"], value = 80 },
  { field = ["VpcId"], from_step = 0, from_path = ["Vpc", "VpcId"] },
  { field = ["TargetType"], value = "ip" },
]
response_checks = [
  { path = ["TargetGroups", "0", "TargetGroupName"], input_field = ["Name"] },
  { path = ["TargetGroups", "0", "Protocol"], input_field = ["Protocol"] },
  { path = ["TargetGroups", "0", "Port"], input_field = ["Port"] },
  { path = ["TargetGroups", "0", "VpcId"], input_field = ["VpcId"] },
  { path = ["TargetGroups", "0", "TargetType"], input_field = ["TargetType"] },
]

[[relationships]]
source = 1
target = 0
relation = "IN_VPC"
observed_path = ["Subnet", "VpcId"]

[[relationships]]
source = 2
target = 0
relation = "IN_VPC"
observed_path = ["Subnet", "VpcId"]
