format = 1

# Metadata only: no function code, signing job, certificate, or private key.
# Pinned Signer PutSigningProfile supports the AWS-managed Lambda platform;
# emulator signer state marks this platform requires_signing_material = false.
# The Lambda overlay enumerates ListCodeSigningConfigs and GetCodeSigningConfig.
# Signer collection and signer-version graph mappings are separate coverage gates.
[[steps]]
id = 0
service = "signer"
operation = "PutSigningProfile"
kind = "AWS::Signer::SigningProfile"
identity = ["arn"]
inputs = [
  { field = ["profileName"], value = "inventory_seed_lambda_signing" },
  { field = ["platformId"], value = "AWSLambda-SHA384-ECDSA" },
]

[[steps]]
id = 1
service = "lambda"
operation = "CreateCodeSigningConfig"
kind = "AWS::Lambda::CodeSigningConfig"
identity = ["CodeSigningConfig", "CodeSigningConfigArn"]
inputs = [
  { field = ["Description"], value = "Local inventory metadata fixture" },
  { field = ["AllowedPublishers", "SigningProfileVersionArns"], value = [{ from_step = 0, from_path = ["profileVersionArn"] }] },
  { field = ["CodeSigningPolicies", "UntrustedArtifactOnDeployment"], value = "Enforce" },
]
response_checks = [
  { path = ["CodeSigningConfig", "Description"], input_field = ["Description"] },
  { path = ["CodeSigningConfig", "AllowedPublishers", "SigningProfileVersionArns"], input_field = ["AllowedPublishers", "SigningProfileVersionArns"] },
  { path = ["CodeSigningConfig", "CodeSigningPolicies", "UntrustedArtifactOnDeployment"], input_field = ["CodeSigningPolicies", "UntrustedArtifactOnDeployment"] },
]
