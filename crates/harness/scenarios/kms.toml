format = 1

# LOCAL emulator only. The pinned CreateKey documentation defines EXTERNAL as
# creation without key material. Never replace it with the AWS_KMS default,
# import material, request an import token, or perform cryptographic operations.
# Distinct keys deliberately share metadata: identity must use the returned ARN.
# Three keys exceed the reviewed ListKeys page_size=1.
# CreateAlias returns Unit. Alias ARN provenance is therefore explicitly the
# requested AliasName, while TargetKeyId binds the preceding key's returned ARN.
# Unit cannot confirm a returned target ARN, so no alias-to-key oracle edge is
# declared. No grant, import, or cryptographic coverage is implied.

[[steps]]
id = 0
service = "kms"
operation = "CreateKey"
kind = "AWS::KMS::Key"
identity = ["KeyMetadata", "Arn"]
inputs = [
  { field = ["Origin"], value = "EXTERNAL" },
  { field = ["KeySpec"], value = "SYMMETRIC_DEFAULT" },
  { field = ["KeyUsage"], value = "ENCRYPT_DECRYPT" },
  { field = ["MultiRegion"], value = false },
  { field = ["Description"], value = "Inventory seed external key without material" },
]
response_checks = [
  { path = ["KeyMetadata", "Origin"], input_field = ["Origin"] },
  { path = ["KeyMetadata", "KeySpec"], input_field = ["KeySpec"] },
  { path = ["KeyMetadata", "KeyUsage"], input_field = ["KeyUsage"] },
  { path = ["KeyMetadata", "MultiRegion"], input_field = ["MultiRegion"] },
  { path = ["KeyMetadata", "Description"], input_field = ["Description"] },
]

