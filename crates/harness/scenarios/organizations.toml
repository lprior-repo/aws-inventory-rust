format = 1

# Local metadata only, on an emulator account without an existing organization.
# DescribeOrganization inventories the response-derived Organization.Arn.
# CreateAccount is asynchronous: CreateAccountStatus.Id is a request identity,
# not an account identity. A bounded DescribeCreateAccountStatus waiter must
# require State=SUCCEEDED and obtain AccountId before account seeding is valid.
# No organizational-unit ParentId is fabricated: CreateOrganization returns no
# root ID, and complete recursive OU discovery is deferred by the overlay.

[[steps]]
id = 0
service = "organizations"
operation = "CreateOrganization"
kind = "AWS::Organizations::Organization"
scope = "account"
identity = ["Organization", "Arn"]
inputs = [{ field = ["FeatureSet"], value = "ALL" }]
response_checks = [
  { path = ["Organization", "FeatureSet"], input_field = ["FeatureSet"] },
]
