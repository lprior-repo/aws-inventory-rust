[package]
name = "inventory-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Development harness: fixture provenance, oracle snapshots and release packaging."
publish = false

[features]
native-graph-integration = []
native-emulator-tests = []

[[test]]
name = "seed_inventory"
path = "tests/seed_inventory.rs"
required-features = ["native-emulator-tests"]

[[test]]
name = "native_graph_inventory"
path = "tests/native_graph_inventory.rs"
required-features = ["native-emulator-tests", "native-graph-integration"]

[[bin]]
name = "inventory-harness"
path = "src/main.rs"

[dependencies]
catalog-tool = { path = "../catalog-tool" }
inventory-core = { path = "../core", default-features = false }
aws-wire = { path = "../aws-wire" }
http = "1.5.0"
bytes = "1.12.1"
futures-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true
base16ct.workspace = true
sqlx.workspace = true
aws-config = "1.13.2"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudcontrol = { version = "1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
toml.workspace = true
zip.workspace = true
httparse = "1.10.1"
tokio-rustls = "0.26.6"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
tokio-util.workspace = true
minicbor.workspace = true

tempfile = "3.27.0"
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "rand", "event", "process"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
hex = "0.4.3"
rustls = "0.23.36"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
inventory-engine = { workspace = true, default-features = false }
cmdb-view = { path = "../cmdb-view" }
redis = { version = "1.8.1", features = ["tokio-rustls-comp"] }

[lints]
workspace = true
