[package]
name = "inventory-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Development harness: fixture provenance, oracle snapshots and release packaging."
publish = false

[[bin]]
name = "inventory-harness"
path = "src/main.rs"

[dependencies]
catalog-tool = { path = "../catalog-tool" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true
base16ct.workspace = true
sqlx.workspace = true
aws-config = "1.13.2"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudcontrol = { version = "1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
toml.workspace = true
zip.workspace = true
httparse = "1.10.1"
tokio-rustls = "0.26.6"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
tokio-util.workspace = true
minicbor.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
