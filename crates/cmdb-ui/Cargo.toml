[package]
name = "cmdb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPU-rendered desktop viewer for schema16 inventory and live graph data"

[dependencies]
# Keep the Makepad 2.0 source pin: the latest published widgets are still 1.0.0.
# Only the core widget family is linked; this screen needs views, labels,
# buttons, inputs, a portal list and its scroll bar.
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "506ec05105b9adb08d1d21f9879df181b5244ea7", default-features = false }
cmdb-view = { path = "../cmdb-view" }
inventory-core = { workspace = true, default-features = false }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
inventory-engine = { workspace = true, default-features = false }
sqlx.workspace = true
redis = { version = "1.8.1", features = ["tokio-rustls-comp"] }
sha2.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
