[package]
name = "cmdb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPU-rendered desktop viewer for schema17 inventory and live graph data"

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "506ec05105b9adb08d1d21f9879df181b5244ea7", default-features = false }
cmdb-view = { path = "../cmdb-view" }
inventory-core = { workspace = true, default-features = false }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
inventory-graph = { workspace = true, features = ["test-fixtures"] }
inventory-harness = { path = "../harness" }
inventory-engine = { workspace = true, default-features = false }
sqlx.workspace = true
redis = { version = "1.8.1", features = ["tokio-rustls-comp"] }
sha2.workspace = true
tempfile = "3.27.0"
proptest.workspace = true
criterion = "=0.8.2"

[[bench]]
name = "layout"
harness = false

[lints]
workspace = true
