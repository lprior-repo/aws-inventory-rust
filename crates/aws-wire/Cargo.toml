[package]
name = "aws-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model-driven AWS wire engine: signing, transport, request serializers and response decoders."
publish = false

[dependencies]
thiserror.workspace = true
inventory-core = { path = "../core", default-features = false }
aws-sigv4 = { version = "1.6.5", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3.1"
aws-smithy-runtime-api = "1.21.0"
bytes = "1.12.1"
flate2 = "1.1.11"
http = "1.5.0"
http-body-util = "0.1.5"
h2 = "0.4.20"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "aws-lc-rs", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.16.0"
rustls-native-certs = "0.8.5"
tokio.workspace = true
tower-service = "0.3.3"

[dev-dependencies]
catalog-tool = { path = "../catalog-tool" }
serde_json.workspace = true
tempfile = "3.27.0"
quick-xml = "0.42"
hyper = { version = "1.12.0", features = ["server"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
