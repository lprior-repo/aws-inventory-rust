[package]
name = "inventory-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
inventory-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
sha2.workspace = true
base16ct.workspace = true
# Upstream's merged SQLite 0.39 support; retain bundled SQLite and allocation limits.
# https://github.com/transact-rs/sqlx/pull/4502
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["sqlite", "runtime-tokio"] }
redis = { version = "1.8.1", features = ["tokio-rustls-comp"] }

[dev-dependencies]
tempfile = "3"
proptest.workspace = true

[lints]
workspace = true

